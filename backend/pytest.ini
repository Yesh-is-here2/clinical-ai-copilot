[pytest]
markers =
    integration: requires a live PostgreSQL + pgvector database (and, for
        some cases, MLflow/network). Never run as part of the default
        suite - see tests/integration/README.md.

# Excluded by default so `pytest -q` (the canonical local/CI command)
# never requires Docker, PostgreSQL, or network access. Run integration
# tests explicitly with: pytest -m integration
addopts = -m "not integration"
