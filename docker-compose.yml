services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: clinical-ai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - clinical_ai_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # This compose file is the local development stack, so it builds
      # with the test toolchain included: `docker compose exec backend
      # pytest -q` is the canonical local verification command and must
      # work without a separate rebuild. A production build should
      # override this (e.g. `docker compose build --build-arg
      # INSTALL_DEV=false backend`, or a dedicated prod compose file)
      # once one exists.
      args:
        INSTALL_DEV: "true"
        # Real cross-encoder reranking (Milestone D) is an optional,
        # heavier extra (sentence-transformers + torch) and is
        # deliberately left off here - HybridRetrievalService falls back
        # to fused (non-reranked) results with explicit degradation
        # metadata when it's not installed. Uncomment to enable it
        # locally:
        # INSTALL_RERANKER: "true"

    container_name: clinical-ai-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data:ro
      - ./data/guidelines/processed:/app/data/guidelines/processed

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  clinical_ai_postgres_data:

